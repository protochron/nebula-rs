[package]
name = "nebula-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
snow = { version = "0.10.0", features = ["risky-raw-split"] }
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
prost = "0.14.4"
thiserror = { workspace = true }
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
hex = "0.4.3"
pem = "3.0.6"
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full", "test-util"] }
serde_json = "1"
